<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DeafPirates — Background Ops</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
/* ── Canonical tokens (mirror of world/brand/tokens.css) ── */
:root{
  --bg:#070b12;--panel:#0d141f;--panel-2:#111b2a;--edge:#1d2c40;--edge-2:#273b56;
  --ink:#dce8f5;--mute:#6f8198;--dim:#46586e;
  --live:#7EFF00;--info:#33c8ff;--warn:#ffb22e;--alert:#ff4d52;--accent-warm:#d94a1f;
  --live-glow:rgba(126,255,0,.30);--info-glow:rgba(51,200,255,.35);
  --font-display:"Oswald",system-ui,sans-serif;--font-ui:"Barlow Condensed",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:var(--font-ui);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(1200px 600px at 50% -10%,rgba(51,200,255,.06),transparent 60%),
    linear-gradient(180deg,#070b12,#05080d 60%,#04060a)}
.mono{font-family:var(--font-mono)}
/* topbar */
.top{flex:none;display:flex;align-items:center;gap:12px;padding:11px 16px;
  background:linear-gradient(180deg,#10202f,#0a131d);border-bottom:1px solid var(--edge-2)}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.28em;font-size:16px;
  text-transform:uppercase;color:#eaf4ff;text-shadow:0 0 18px var(--info-glow)}
.brand small{display:block;font-family:var(--font-mono);letter-spacing:.22em;font-size:8px;color:var(--mute);font-weight:500;margin-top:1px}
.top .spacer{flex:1}
.stat{font-family:var(--font-mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.stat b{color:var(--live)}
.clock{font-family:var(--font-mono);font-size:11px;color:var(--info);min-width:62px;text-align:right}
/* board */
#wrap{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 28px}
.group{margin-bottom:18px}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.gdot{width:8px;height:8px;border-radius:50%}
.gtitle{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.gcount{font-family:var(--font-mono);font-size:9px;color:var(--dim);background:var(--panel);border:1px solid var(--edge);
  border-radius:10px;padding:1px 7px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
/* card */
.card{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--edge);
  border-radius:10px;padding:11px 12px;position:relative;overflow:hidden}
.card.running{border-color:rgba(126,255,0,.30)}
.card.blocked{border-color:rgba(255,178,46,.35)}
.card.overdue{border-color:rgba(255,77,82,.45);box-shadow:0 0 0 1px rgba(255,77,82,.25)}
.crow{display:flex;align-items:flex-start;gap:8px}
.kind{font-family:var(--font-mono);font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 5px;border-radius:4px;flex:none;margin-top:2px}
.kind.cron{background:rgba(51,200,255,.12);color:var(--info)}
.kind.task{background:rgba(126,255,0,.12);color:var(--live)}
.kind.project{background:rgba(217,74,31,.14);color:#ff9d6e}
.ctitle{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:.02em;line-height:1.15;flex:1}
.owner{display:flex;align-items:center;gap:5px;flex:none}
.odot{width:7px;height:7px;border-radius:50%}
.oname{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:8px;font-family:var(--font-mono);font-size:9px;color:var(--mute)}
.meta b{color:var(--ink);font-weight:500}
/* time-budget bar — the "length it must take" */
.budget{margin-top:10px}
.blabel{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:8px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.btrack{height:6px;border-radius:4px;background:#0a131e;border:1px solid var(--edge);overflow:hidden}
.bfill{height:100%;border-radius:4px;transition:width .6s ease}
.budget .due{color:var(--mute)}
.budget.over .due{color:var(--alert)}
/* hitl / status chip */
.chip{position:absolute;top:10px;right:10px;font-family:var(--font-mono);font-size:8px;letter-spacing:.08em;
  padding:2px 7px;border-radius:5px;text-transform:uppercase}
.chip.lock{background:rgba(255,178,46,.14);color:var(--warn);border:1px solid rgba(255,178,46,.3)}
.chip.done{background:rgba(126,255,0,.12);color:var(--live)}
.foot{margin-top:9px;font-family:var(--font-mono);font-size:8.5px;color:var(--dim);display:flex;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <div class="brand">DEAFPIRATES<small>BACKGROUND OPS · CRON + TASKS</small></div>
  <div class="spacer"></div>
  <div class="stat" id="stat"></div>
  <div class="clock mono" id="clock"></div>
</div>
<div id="wrap"></div>

<script>
/* ============================================================
   TASKS — the seam. Real Hermes cron/kanban emits this shape.
   budgetMin = "length it must take" (time budget / SLA, minutes).
   ============================================================ */
const ROSTER = { // canonical accents
  DIME:'#ff4d52',LEMMY:'#c9a24b',EDDIE:'#7fc8ff',GEDDY:'#33c8ff',SLASH:'#ffb22e',
  HALFORD:'#b06bff',HETFIELD:'#9aae12',GENE:'#3fe08a',NIKKI:'#ff7ac0',GIGGUIDE:'#ff9d3a',
  ANGUS:'#56d2ff',RANDY:'#caa46a',DIO:'#ff4d52',OZZY:'#b06bff',NEIL:'#e8d9b0'
};
const MIN = 60000, HOUR = 60*MIN, DAY = 24*HOUR, now = ()=>Date.now();

// started/due are ms offsets from load so the demo stays live
const T0 = now();
let TASKS = [
  { id:'seo-weekly', title:'Weekly SEO sweep — NakedApp', owner:'GENE', kind:'cron',
    schedule:'0 6 * * 1', status:'running', startedAt:T0-38*MIN, budgetMin:90, hitl:null, progress:0.42 },
  { id:'inbox-triage', title:'Triage + draft inbox replies', owner:'NEIL', kind:'cron',
    schedule:'*/30 * * * *', status:'blocked', startedAt:T0-12*MIN, budgetMin:20, hitl:'Cory', progress:1,
    note:'9 drafts ready — holding on action lock' },
  { id:'webapp-a11y', title:'Accessibility pass — events pages', owner:'EDDIE', kind:'task',
    schedule:'one-off', status:'running', startedAt:T0-2*HOUR-10*MIN, budgetMin:180, hitl:null, progress:0.74 },
  { id:'press-kit', title:'Press kit refresh + bio', owner:'NIKKI', kind:'project',
    schedule:'one-off', status:'running', startedAt:T0-3*DAY, budgetMin:5*DAY/MIN, hitl:null, progress:0.55 },
  { id:'royalty-audit', title:'Catalogue royalty audit', owner:'GENE', kind:'project',
    schedule:'one-off', status:'overdue', startedAt:T0-9*DAY, budgetMin:7*DAY/MIN, hitl:null, progress:0.8 },
  { id:'gig-scan', title:'Scan NZ metal gig feeds', owner:'GIGGUIDE', kind:'cron',
    schedule:'0 */6 * * *', status:'queued', startedAt:null, budgetMin:15, hitl:null, progress:0 },
  { id:'backup', title:'Off-machine backup', owner:'HETFIELD', kind:'cron',
    schedule:'0 3 * * *', status:'done', startedAt:T0-20*MIN, budgetMin:10, hitl:null, progress:1, ranMs:6*MIN },
];

const STATUS = {
  running:{label:'Running',  dot:'var(--live)'},
  blocked:{label:'Blocked · HITL', dot:'var(--warn)'},
  overdue:{label:'Overdue',  dot:'var(--alert)'},
  queued: {label:'Queued',   dot:'var(--info)'},
  done:   {label:'Done · recent', dot:'var(--mute)'},
};
const ORDER = ['running','blocked','overdue','queued','done'];

function fmtDur(ms){
  if(ms<0)ms=0; const m=Math.round(ms/MIN);
  if(m<60)return m+'m'; const h=Math.floor(m/60);
  if(h<24)return h+'h'+(m%60?(' '+(m%60)+'m'):''); const d=Math.floor(h/24);return d+'d'+(h%24?(' '+(h%24)+'h'):'');
}
function budgetColor(ratio,over){ if(over)return 'var(--alert)'; if(ratio>0.8)return 'var(--warn)'; return 'var(--live)'; }

function card(t){
  const c=ROSTER[t.owner]||'var(--info)';
  const budgetMs=t.budgetMin*MIN;
  const elapsed=t.startedAt?(now()-t.startedAt):0;
  const ratio=budgetMs?Math.min(elapsed/budgetMs,1.5):0;
  const over=t.status==='overdue'||(t.startedAt&&elapsed>budgetMs&&t.status==='running');
  const dueAt=t.startedAt?t.startedAt+budgetMs:null;
  const remain=dueAt?dueAt-now():null;
  const fillW=Math.min(ratio*100,100);
  const fillC=t.status==='done'?'var(--live)':budgetColor(ratio,over);
  const cls=(over?'overdue':t.status);
  let chip='';
  if(t.hitl)chip='<span class="chip lock">⏸ waiting · '+t.hitl+'</span>';
  else if(t.status==='done')chip='<span class="chip done">✓ done</span>';
  const dueTxt=t.status==='done'?('ran in '+fmtDur(t.ranMs||elapsed))
    :t.status==='queued'?'not started'
    :over?('OVER by '+fmtDur(-remain)):(fmtDur(remain)+' left');
  return '<div class="card '+cls+'">'+chip+
    '<div class="crow">'+
      '<span class="kind '+t.kind+'">'+t.kind+'</span>'+
      '<div class="ctitle">'+t.title+'</div>'+
      '<div class="owner"><span class="odot" style="background:'+c+';box-shadow:0 0 6px '+c+'"></span>'+
        '<span class="oname" style="color:'+c+'">'+t.owner+'</span></div>'+
    '</div>'+
    '<div class="meta">'+
      '<span>sched <b>'+t.schedule+'</b></span>'+
      (t.startedAt&&t.status!=='done'?'<span>elapsed <b>'+fmtDur(elapsed)+'</b></span>':'')+
      '<span>budget <b>'+fmtDur(budgetMs)+'</b></span>'+
      (t.progress?'<span>progress <b>'+Math.round(t.progress*100)+'%</b></span>':'')+
    '</div>'+
    '<div class="budget '+(over?'over':'')+'">'+
      '<div class="blabel"><span>time budget</span><span class="due">'+dueTxt+'</span></div>'+
      '<div class="btrack"><div class="bfill" style="width:'+fillW+'%;background:linear-gradient(90deg,'+fillC+','+fillC+'aa)"></div></div>'+
    '</div>'+
    (t.note?'<div class="foot">'+t.note+'</div>':'')+
  '</div>';
}

function render(){
  const wrap=document.getElementById('wrap');
  let html='';
  ORDER.forEach(st=>{
    const items=TASKS.filter(t=>(t.status==='overdue'?'overdue':t.status)===st ||
      (st==='overdue'&&t.startedAt&&t.status==='running'&&(now()-t.startedAt)>t.budgetMin*MIN));
    const list=TASKS.filter(t=>{
      const over=t.startedAt&&t.status==='running'&&(now()-t.startedAt)>t.budgetMin*MIN;
      const eff=(t.status==='overdue'||over)?'overdue':t.status;
      return eff===st;
    });
    if(!list.length)return;
    const s=STATUS[st];
    html+='<div class="group"><div class="ghead"><span class="gdot" style="background:'+s.dot+
      ';box-shadow:0 0 7px '+s.dot+'"></span><span class="gtitle">'+s.label+'</span>'+
      '<span class="gcount">'+list.length+'</span></div><div class="grid">'+
      list.map(card).join('')+'</div></div>';
  });
  wrap.innerHTML=html;
  const running=TASKS.filter(t=>t.status==='running').length;
  const blocked=TASKS.filter(t=>t.hitl).length;
  document.getElementById('stat').innerHTML='<b>'+running+'</b> running · '+blocked+' awaiting you · '+TASKS.length+' total';
}
function tick(){ document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-NZ',{hour12:false}); }
render(); tick();
setInterval(()=>{ render(); tick(); }, 1000);
</script>
</body>
</html>
